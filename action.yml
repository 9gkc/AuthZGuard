name: AuthZGuard
description: Validate a declared authorization matrix without sending requests.
inputs:
  scope:
    description: Path to the approved scope document.
    required: true
  matrix:
    description: Path to the authorization matrix.
    required: true
  openapi:
    description: Optional path to a local OpenAPI document.
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - shell: bash
      run: python -m pip install "${{ github.action_path }}"
    - shell: bash
      run: >-
        authzguard validate --scope "${{ inputs.scope }}" --matrix "${{ inputs.matrix }}"
        ${{ inputs.openapi && format('--openapi "{0}"', inputs.openapi) || '' }}

