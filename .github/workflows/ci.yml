name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package
        run: python -m pip install .
      - name: Run safety and report tests
        run: python -m unittest discover -s tests -v
      - name: Validate local-only example configuration
        run: authzguard validate --scope examples/scope.local.yaml --matrix examples/matrix.local.yaml --openapi examples/openapi.local.yaml

